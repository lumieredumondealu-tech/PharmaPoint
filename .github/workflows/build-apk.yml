
name: Build PharmaPoint Patient APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Vérifier les fichiers Android
        run: |
          ls -la
          test -f gradlew
          test -f app/build.gradle

      - name: Autoriser Gradle
        run: chmod +x gradlew

      - name: Compiler l'APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Publier l'APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaPoint-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
