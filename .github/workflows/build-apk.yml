name: Build PharmaPoint APK

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 11
        uses: actions/setup-java@v3
        with:
          java-version: '11'
          distribution: 'temurin'
          cache: gradle

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build APK (Release)
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mv app/build/outputs/apk/release/app-release.apk PharmaPoint-Patient-V1.0.apk

      - name: Upload APK to artifacts
        uses: actions/upload-artifact@v3
        with:
          name: PharmaPoint-Patient-V1.0
          path: PharmaPoint-Patient-V1.0.apk
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v1.0.0-${{ github.run_number }}
          release_name: PharmaPoint Patient v1.0.0
          body: |
            ## 📱 PharmaPoint Patient - Release v1.0.0
            
            ### APK Build Details
            - **Build Date**: ${{ github.event.head_commit.timestamp }}
            - **Build ID**: ${{ github.run_number }}
            - **Commit**: ${{ github.event.head_commit.message }}
            
            ### Instructions d'installation
            1. Téléchargez le fichier APK
            2. Installez-le sur votre appareil Android
            3. Accordez les permissions nécessaires
            
            ### Note de licence
            ⚠️ **LICENCE COMMERCIALE PROPRIÉTAIRE**
            Ce logiciel est soumis à une licence commerciale propriétaire.
            La revente est strictement interdite.
            
            Pour plus d'informations, consultez le fichier LICENSE.md
          draft: false
          prerelease: false

      - name: Upload APK to Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          files: PharmaPoint-Patient-V1.0.apk
          tag_name: v1.0.0-${{ github.run_number }}
          body: |
            ## 📱 PharmaPoint Patient - Release v1.0.0
            
            ### 📦 Fichier APK
            - **Nom**: PharmaPoint-Patient-V1.0.apk
            - **Build**: ${{ github.run_number }}
            
            ### ⚠️ IMPORTANT - Licence Commerciale Propriétaire
            - Revente interdite
            - Utilisation commerciale autorisée sous licence annuelle
            - Garantie incluse pendant la période de validité
            - Support technique inclus
            
            Consultez [LICENSE.md](LICENSE.md) pour les conditions complètes.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
